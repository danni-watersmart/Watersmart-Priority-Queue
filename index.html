  --shadow: 0 1px 2px rgba(34,26,38,.06), 0 8px 24px -12px rgba(34,26,38,.18);
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  /* Both set from the chosen typeface at runtime; General Sans is the default. */
  --disp: 'General Sans', ui-sans-serif, system-ui, sans-serif;
  --body: 'General Sans', ui-sans-serif, system-ui, sans-serif;
  --weight: 400;
  --weight-strong: 600;
  font-family: var(--body);
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  font-size: 16px;
  font-weight: var(--weight);
  line-height: 1.5;
}
/* :where() contributes no specificity, so this reset sits at (0,0,1) and loses
   to every class below it. Written as .pq button it was (0,1,1) and silently
   outranked .btn, .chip, .inp and friends \u2014 which is why chips that happened to
   be buttons rendered at body size while identical span chips did not. */
:where(.pq) button, :where(.pq) input, :where(.pq) select, :where(.pq) textarea { font: inherit; color: inherit; }
.pq :focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; border-radius: 4px; }

/* --- shell --- */
.pq-shell { max-width: none; margin: 0 auto; padding: 0 24px 0; }
.pq-top {
  position: sticky; top: 0; z-index: 30; background: var(--paper);
  border-bottom: 1px solid var(--pink-line); margin: 0 -20px 22px; padding: 14px 20px 12px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.pq-brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.viewtab {
  font-family: var(--disp); font-size: 15px; font-weight: 500; letter-spacing: -.01em;
  padding: 6px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--pink-line); background: var(--card); color: var(--ink-2);
}
.viewtab:hover { background: var(--pink-soft); }
.viewtab.on { background: var(--pink); border-color: var(--accent-edge); color: var(--on-accent); }
.avatar-btn { border: none; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; position: relative; }
.avatar-dot { position: absolute; right: 12px; bottom: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--paper); }
.avatar-caret { color: var(--accent-2); font-size: 11px; }
.help { max-height: 62vh; overflow: auto; padding-right: 6px; }
.help h3 { font-family: var(--disp); font-size: 17px; font-weight: var(--weight-strong); letter-spacing: -.02em; margin: 18px 0 6px; }
.help h3:first-child { margin-top: 0; }
.help p { margin: 0 0 10px; max-width: 72ch; color: var(--ink-2); }
.help ul, .help ol { margin: 0 0 12px; padding-left: 20px; max-width: 72ch; color: var(--ink-2); }
.help li { margin-bottom: 6px; }
.help strong { color: var(--ink); }
.avatar-btn:hover { outline: 2px solid var(--pink); outline-offset: 1px; }
.pq-mark {
  font-family: var(--disp); font-weight: var(--weight-strong); font-size: 20px; letter-spacing: -.03em;
  background: var(--pink); color: var(--on-accent); padding: 3px 9px; border-radius: 3px; border: 1px solid var(--pink-line);
}
.pq-sub { font-family: var(--body); font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }
.pq-cols { display: grid; grid-template-columns: 224px minmax(0,1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .pq-cols { grid-template-columns: 1fr; } .pq-rail { order: 2; } }

/* The side panel earns its width by being quieter than the list, not by hiding
   things behind a toggle. */
.pq-rail { font-size: 14px; }
.pq-rail .card { padding: 12px; }
.pq-rail .eyebrow { font-size: 11.5px; margin-bottom: 7px; font-family: var(--body); }
.pq-rail .chip { font-size: 11.5px; padding: 3px 9px; font-family: var(--body); }
.pq-rail .btn-sm { font-size: 12.5px; padding: 4px 8px; }
.pq-rail .inp { font-size: 13px; padding: 6px 9px; }
.pq-rail .row { gap: 5px; }

/* --- generic --- */
.eyebrow {
  font-family: var(--body); font-size: 11.5px; letter-spacing: .04em; font-weight: 500;
  color: var(--ink-3); margin: 0 0 9px;
}
.card { background: var(--card); border: 1px solid var(--pink-line); border-radius: 10px; }
.pad { padding: 14px; }
.btn {
  border: 1px solid var(--pink-line); background: var(--card); border-radius: 7px;
  padding: 7px 12px; cursor: pointer; font-size: 14px; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--pink-soft); border-color: var(--pink); }
.btn-primary { background: var(--pink); border-color: var(--accent-edge); font-weight: 600; color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--pink-soft); }
.btn-sm { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.inp {
  width: 100%; border: 1px solid var(--pink-line); border-radius: 7px; padding: 8px 10px;
  background: var(--card); font-size: 14px;
}
.inp:focus { border-color: var(--plum); }
textarea.inp { resize: vertical; line-height: 1.5; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink-2); }
.tiny { font-size: 12.5px; }
.hr { height: 1px; background: var(--pink-line); border: 0; margin: 12px 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- task rows --- */
.queue { display: flex; flex-direction: column; gap: 7px; }

/* Condensed: title and how often it has been pushed down, nothing else. For
   scanning a long queue rather than working inside it. */
.queue.dense { gap: 3px; }
.queue.dense .task { padding: 5px 10px 5px 8px; border-radius: 7px; box-shadow: none; align-items: center; }
.queue.dense .task-title { font-size: 14.5px; }
.queue.dense .task-meta, .queue.dense .make-active, .queue.dense .active-label { display: none; }
.queue.dense .done-check-text { display: none; }
.queue.dense .done-check.waiting { opacity: .45; }
.done-check.waiting:hover { opacity: .75; }
.done-check { padding: 1px 3px; border-color: transparent; background: none; }
.queue.dense .gauge-bars { display: none; }
.queue.dense .task-rank { padding-top: 0; }
.queue.dense .task-side { flex-direction: row; align-items: center; gap: 1px; }
.queue.dense .task-side .btn-sm { padding: 0 4px; line-height: 1.1; font-size: 11px; }
.queue.dense .gauge { gap: 2px; }
.queue.dense .gauge-n { min-width: 12px; }
.queue.dense .task.active { padding-top: 6px; padding-bottom: 6px; }
.queue.dense .task.active .task-title button { font-size: 15.5px; }
.task {
  background: var(--task-bg, var(--card));
  display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start;
  border: 1px solid var(--pink-line); border-left-width: 3px;
  border-radius: 10px; padding: 11px 12px 11px 10px; cursor: grab;
}
.task.drag { opacity: .35; }

/* A line where the task will land, rather than a highlight on the row it is
   passing over. */
.drop-before, .drop-after { position: relative; }
.drop-before::before, .drop-after::after {
  content: ""; position: absolute; left: 0; right: 0; height: 3px;
  background: var(--accent-ink); border-radius: 2px; z-index: 2;
}
.drop-before::before { top: -5px; }
.drop-after::after { bottom: -5px; }
.queue.dense .drop-before::before { top: -3px; }
.queue.dense .drop-after::after { bottom: -3px; }
.section-row.drop-before::before, .section-row.drop-after::after,
label.drop-before::before, label.drop-after::after { left: 4px; right: 4px; }
/* While a finger drag is running, stop the page scrolling underneath it. */
body.pq-dragging { overflow: hidden; touch-action: none; user-select: none; }
body.pq-dragging .task { touch-action: none; }
.task.lift { box-shadow: 0 10px 24px -8px rgba(34,26,38,.45); transform: scale(1.01); }
.task.over { border-top: 2px solid var(--plum); }
.task.done { background: #FCFAFC; }
/* Work marked as your own priority. Darker, so the balance between your work
   and everybody else's is visible without reading a single title. */
/* Your own priorities are a light wash of the second colour; the active task is
   darker with a ring around it. They have to be told apart at a glance, and a
   task can be both. */
.task.mine { background: var(--mine-tint); }

/* Below a week's worth of work. Faded rather than hidden: it is still your
   list, but nothing down here starts until something above it finishes. */
.task.below-line { opacity: .72; }
.task.first-below { margin-top: 26px; position: relative; }
.task.first-below::before {
  content: "a week of work \u2014 below this line, nothing starts until something above it finishes";
  position: absolute; left: 0; right: 0; top: -19px;
  font-size: 11px; color: var(--rasp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-top: 2px dashed var(--rasp); padding-top: 3px;
}
.task.active.mine { background: var(--accent-tint); border-left-color: var(--accent-2); }
/* The active task: deeper fill and a ring, so it stays the most prominent row
   even when it is also one of your own. */
.task.active {
  background: var(--accent-tint); border-left-width: 6px;
  padding-top: 13px; padding-bottom: 13px;
  border-color: var(--accent-ink);
  box-shadow: 0 0 0 2px var(--accent-edge), var(--shadow);
}
.task.active.mine { background: var(--accent-tint); }
.task.active .task-title button { font-weight: 600; }
.active-label { font-family: var(--disp); font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--accent-ink); margin: 0 0 4px; }

.active-dot { color: var(--accent-ink); font-size: 11px; }
.task.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 55% { background: var(--pink); } 100% { background: var(--card); } }
@media (prefers-reduced-motion: reduce) { .task.flash { animation: none; outline: 2px solid var(--accent-ink); } }

/* decal layer */
.pq-decal { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.pq-shell { position: relative; z-index: 1; }   /* must not touch .pq-top, which is sticky */

/* A tinted wash behind the whole app, in the chosen colour. The cards, the
   filters and the queue all sit on top of it, so the edge of a panel is visible
   without another border \u2014 and the transparency people set on their tasks
   actually reads as transparency, because there is something behind it. */
.pq { background: var(--page-wash, var(--paper)); }
.pq-modern .pq-top { background: var(--header-wash, rgba(255,255,255,.82)); }
.pq .card, .pq .task, .pq .review-section, .pq .pq-rail .card {
  /* Slightly firmer edges now that panels sit on a tinted ground. */
  border-color: var(--pink-line);
}
.avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--pink-line); }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; background: var(--card); border: 1px solid var(--pink-line); border-radius: 9px; box-shadow: var(--shadow); min-width: 230px; max-height: 300px; overflow: auto; padding: 5px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu button:hover { background: var(--pink-soft); }
/* The week strip. Blocks sized by how long each spell ran, with the joins
   between them as narrow handles. */
/* A day scrolls sideways rather than squeezing. Proportional widths alone made
   a ten-minute spell a sliver and its handle unclickable, which is exactly the
   spell somebody wants to correct. */
.day-strip {
  display: flex; align-items: stretch; gap: 0; min-height: 62px;
  overflow-x: auto; padding-bottom: 6px;
}
.day-block {
  background: var(--accent-tint); border: 1px solid var(--accent-edge); border-radius: 8px;
  padding: 7px 9px; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
  flex: 0 0 auto; min-width: 104px;
}
.day-block-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-block-time { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* Wide enough to hit with a mouse or a thumb, and drawn so it reads as a
   handle rather than as a gap between two blocks. */
.day-join {
  flex: 0 0 auto; width: 26px; margin: 0 -4px; cursor: col-resize;
  border: none; background: none; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.day-join::before {
  content: ""; position: absolute; top: 4px; bottom: 4px; left: 11px; width: 4px;
  background: var(--ink-3); border-radius: 2px;
}
.day-join::after {
  content: "\u21D4"; position: relative; font-size: 11px; line-height: 1;
  color: var(--card); background: var(--ink-3);
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.day-join:hover::before, .day-join.on::before { background: var(--accent-ink); }
.day-join:hover::after, .day-join.on::after { background: var(--accent-ink); transform: scale(1.15); }
.day-join:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 6px; }

.grad-area {
  position: relative; height: 150px; border-radius: 10px; cursor: crosshair;
  border: 1px solid var(--pink-line); touch-action: none;
}
.grad-dot {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none;
}
.grad-hue {
  width: 100%; margin-top: 10px; height: 14px; -webkit-appearance: none; appearance: none;
  border-radius: 999px; border: 1px solid var(--pink-line);
  background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
}
.grad-hue::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; border: 2px solid var(--ink); cursor: pointer;
}
.colour-editor { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(190px, 240px); gap: 16px; align-items: start; }
@media (max-width: 620px) { .colour-editor { grid-template-columns: 1fr; } }
.surface-chip {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border: 1px solid var(--pink-line); background: var(--card); color: var(--ink-2);
  border-radius: 999px; padding: 6px 12px; font-family: var(--body); font-size: 13px;
}
.surface-chip.on { border-color: var(--accent-ink); background: var(--accent-tint); color: var(--ink); font-weight: 600; }
.surface-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); transition: all .12s; }
/* The one being edited is unmistakable, so nobody changes the wrong surface. */
.surface-dot.big {
  width: 26px; height: 26px; margin: -6px 2px -6px -2px;
  border: 2px solid var(--ink); box-shadow: 0 0 0 3px var(--card);
}

/* Settings headings: large enough to find at a glance in a long panel. */
.set-h2 {
  font-family: var(--disp); font-size: 19px; font-weight: var(--weight-strong);
  letter-spacing: -.02em; color: var(--ink); margin: 22px 0 6px;
  padding-top: 16px; border-top: 1px solid var(--pink-line);
}
.set-h2:first-of-type { margin-top: 4px; padding-top: 0; border-top: none; }

.swatch-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.swatch-grid button { aspect-ratio: 1; border-radius: 3px; border: 1px solid rgba(0,0,0,.06); cursor: pointer; padding: 0; }
.task.done .task-title { text-decoration: line-through; color: var(--ink-3); }
.task-rank { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 2px; text-align: right; }
.task-title { font-family: var(--disp); font-weight: var(--weight-strong); font-size: 17px; letter-spacing: -.01em; }
.task-title button { all: unset; cursor: pointer; }
.task-title button:hover { text-decoration: underline; }
.task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; align-items: center; }
.task-side { display: flex; align-items: center; gap: 4px; }

/* The checkbox used to be a bare tick with no words next to it. */
.done-check.waiting { opacity: .45; }
.done-check.waiting:hover { opacity: .75; }
.done-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; flex: 0 0 auto; padding: 2px 7px 2px 4px; border: 1px solid var(--pink-line); border-radius: 20px; background: var(--card); }
/* Same pill as the complete control, so the two actions on a row read as a pair. */
.make-active { color: var(--accent-2); 
  flex: 0 0 auto; cursor: pointer; padding: 2px 8px; border-radius: 20px;
  border: 1px solid var(--pink-line); background: var(--card);
  font-family: var(--body); font-size: 11.5px; letter-spacing: .02em; color: var(--ink-2);
  line-height: 1.6;
}
.make-active:hover { background: var(--pink-soft); border-color: var(--pink); color: var(--accent-ink); }
.done-check:hover { background: var(--pink-soft); border-color: var(--pink); }
.done-check input { accent-color: var(--accent-ink); width: 15px; height: 15px; margin: 0; cursor: pointer; }
.taginput-box {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  border: 1px solid var(--pink-line); border-radius: 7px; padding: 5px 6px; background: var(--card); min-height: 34px;
}
.taginput-box:focus-within { border-color: var(--plum); }
.taginput-field { border: none; outline: none; background: none; flex: 1; min-width: 130px; font-size: 13.5px; padding: 2px; }
.taginput-x { border: none; background: none; cursor: pointer; padding: 0 0 0 4px; color: var(--ink-3); font-size: 12px; }
.taginput-x:hover { color: var(--rasp); }
/* Scratchboard */
.match-row {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; cursor: pointer;
  background: none; font: inherit;
}
.match-row:hover { background: var(--pink-soft); }
.match-row.on { background: var(--accent-tint); border-color: var(--accent-2); }
.match-score { width: 38px; flex: 0 0 auto; color: var(--accent-ink); }
.match-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match-why { flex: 0 0 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Alternate days get a slightly different card so the boundary is visible
   without another heading. */
.note-card.shade-1 { background: var(--pink-soft); }
.note-card { padding: 8px 10px; }
.note-time { flex: 0 0 auto; width: 96px; }
.note-link {
  flex: 0 0 auto; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: none; background: none; cursor: pointer; padding: 0;
  font-size: 11px; color: var(--accent-ink);
}
.note-link:hover { text-decoration: underline; }
@media (max-width: 700px) { .match-why { display: none; } }

/* Highlighting textarea: a mirror layer under a transparent textarea. Both
   carry .inp so padding, border, font and line height are identical \u2014 any
   difference and the coloured words drift away from the real ones. */
.hl-wrap { position: relative; }
.hl-backdrop {
  position: absolute; inset: 0; margin: 0; pointer-events: none; overflow: hidden;
  white-space: pre-wrap; overflow-wrap: break-word; color: transparent;
  background: var(--card);
}
.hl-backdrop mark {
  background: var(--accent-tint); color: var(--accent-ink);
  border-radius: 3px; padding: 0 1px; margin: 0 -1px;
}
.hl-input {
  position: relative; background: transparent; color: var(--ink); caret-color: var(--accent-ink);
  resize: vertical;
}
.hl-input::placeholder { color: var(--ink-3); }

.taginput { position: relative; }
.taginput-suggest { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.taginput-caret { border: none; background: none; cursor: pointer; color: var(--ink-3); font-size: 13px; padding: 0 4px; }
.taginput-caret:hover { color: var(--accent-2); }
.taginput-menu {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
  background: var(--card); border: 1px solid var(--pink-line); border-radius: 10px;
  box-shadow: var(--shadow); padding: 10px; max-height: 260px; overflow: auto;
}
.taginput-menu-group { padding-bottom: 8px; }
.note-list { max-height: 240px; overflow: auto; }
.note-row .tl-when { font-size: 9.5px; }
.note-row .btn-sm { padding: 0 5px; font-size: 11px; }
.note-row { border-top: 1px solid var(--pink-line); padding: 3px 0 2px; line-height: 1.3; }
.note-row:first-child { border-top: none; }
.done-check-text { font-family: var(--body); font-size: 11.5px; letter-spacing: .01em; color: var(--ink-2); }
.task.done .done-check-text { color: var(--teal); }
@media (max-width: 620px) {
  .done-check-text { display: none; }
  .task { grid-template-columns: 22px 1fr auto; padding: 10px 8px; }
  .task-side { flex-direction: column; align-items: flex-end; gap: 2px; }
  .pq-shell { padding: 0 12px 0; }
  .pq-top { margin: 0 -12px 16px; padding: 12px; }
  .viewtab { font-size: 15px; padding: 5px 12px; }
  .make-active { color: var(--accent-2);  display: none; }
}

/* the signature element: pressure gauge for demotion count */
.gauge { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; }
.gauge-bars { display: flex; gap: 1.5px; align-items: flex-end; height: 14px; }
.gauge-bar { width: 3px; background: var(--pink); border-radius: 1px; }
.gauge-n { min-width: 14px; text-align: right; font-weight: 600; }

.chip {
  /* The chosen typeface, like every other label. Monospace is kept for figures
     only, where column alignment is the point. */
  font-family: var(--body); font-size: 11.5px; letter-spacing: .01em;
  border: 1px solid var(--pink-line); border-radius: 20px; padding: 2px 7px; background: var(--pink-soft);
  color: var(--ink-2); white-space: nowrap;
}
.chip.q1 { color: var(--rasp); border-color: #F4C2D4; background: #FFF3F7; }
.chip.q2 { color: var(--teal); border-color: #B6DDD7; background: #F1FAF8; }
.chip.q3 { color: var(--amber); border-color: #EBD3AC; background: #FDF8EF; }
.chip.q4 { color: var(--ink-3); }
.chip.tag { letter-spacing: 0; color: var(--plum); background: #FFF; font-family: var(--body); }
.chip.btn-chip { cursor: pointer; }
.chip.btn-chip:hover { background: var(--pink); }
.chip.on { background: var(--pink); border-color: var(--accent-edge); color: var(--on-accent); }

/* --- drawer --- */
.scrim { position: fixed; inset: 0; background: rgba(34,26,38,.34); z-index: 40; }
.modal-wrap .scrim { z-index: 60; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--card);
  z-index: 41; display: flex; flex-direction: column; border-left: 1px solid var(--pink-line);
  animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(18px); opacity: .4 } to { transform: none; opacity: 1 } }
.drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--pink-line); background: var(--pink-soft); }
.drawer-body { overflow: auto; padding: 16px; flex: 1; }
.drawer-foot { padding: 12px 16px; border-top: 1px solid var(--pink-line); }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none } }

.modal-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.modal { position: relative; z-index: 61; background: var(--card); border-radius: 12px; width: min(860px, 100%); box-shadow: var(--shadow); border: 1px solid var(--pink-line); }

/* --- timeline --- */
.tl { list-style: none; margin: 0; padding: 0 0 0 28px; border-left: 2px solid var(--pink); }
.tl li { position: relative; padding: 0 0 13px 14px; }
.tl li::before { content: none; }
.tl-avatar { position: absolute; left: -34px; top: 0; background: var(--card); border-radius: 50%; padding: 1px; }
.tl-when { font-family: var(--body); font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }

/* --- chat --- */
.bubble { border-radius: 10px; padding: 9px 12px; margin-bottom: 9px; max-width: 88%; white-space: pre-wrap; font-size: 14px; }
.bubble.me { background: var(--pink); margin-left: auto; color: var(--on-accent); }
.bubble.ai { background: var(--pink-soft); border: 1px solid var(--pink-line); }
.bubble.sys { background: #FFF7F9; border: 1px dashed #F0C7D6; color: var(--rasp); font-size: 13px; }

/* --- review --- */
.section-tabs { gap: 6px; margin-bottom: 14px; }
.section-tab {
  font-family: var(--disp); font-size: 14px; font-weight: 500;
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--pink-line); background: var(--card); color: var(--ink-2);
}
.section-tab:hover { background: var(--pink-soft); }
.section-tab.on { background: var(--pink); border-color: var(--accent-edge); color: var(--on-accent); }

.review-section {
  border: 1px solid var(--pink-line); border-radius: 14px;
  padding: 18px 18px 20px; margin-bottom: 18px;
  /* Same transparency control as the task cards, over a light wash of the
     chosen accent so the sections read as one family. */
  background: var(--section-bg, var(--card));
}
/* The cards inside a section sit on the section, so they cannot share its
   colour or the edges disappear. */
.review-section .card {
  border-color: var(--pink-line);
  background: var(--chart-bg, #FFFFFF);
  box-shadow: 0 1px 2px rgba(20,20,30,.05);
}
.review-hr { height: 1px; background: var(--pink-line); border: 0; margin: 16px 0 12px; }
.review-h2 { font-family: var(--disp); font-size: 25px; font-weight: var(--weight-strong); letter-spacing: -.03em; margin: 0 0 4px; }
.review-blurb { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; max-width: 62ch; }
/* A group of charts inside a section needs a heading that reads as a heading,
   not as a caption. */
.review-section .eyebrow {
  font-family: var(--disp); font-size: 16px; font-weight: var(--weight-strong);
  letter-spacing: -.01em; color: var(--ink); margin: 0 0 8px;
}
.review-section .card .eyebrow { font-size: 11.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; }

/* --- two-up grid --- */
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mq { border: 1px solid var(--pink-line); border-radius: 9px; padding: 10px; background: var(--card); min-height: 110px; }
.mq h4 { margin: 0 0 8px; font-family: var(--body); font-size: 11px; letter-spacing: .02em; }

/* ===== Modern skin =========================================================
   Applied only when .pq-modern is on the root, so switching it off in settings
   returns the original look exactly. Airier: a full-width quiet header with the
   view as text tabs rather than buttons, bigger type, softer edges, fewer
   borders and more white space between blocks. */
.pq-modern { --shadow: 0 1px 2px rgba(20,20,30,.04), 0 18px 40px -28px rgba(20,20,30,.28); }
.pq-modern .pq-shell { max-width: none; padding: 0 32px 0; }
.pq-modern .pq-top {
  background: rgba(255,255,255,.82); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--pink-line); padding: 16px 28px; margin: 0 -28px 30px; gap: 22px;
}
.pq-modern .pq-mark {
  background: none; border: none; padding: 0; font-size: 21px; font-weight: 600; letter-spacing: -.04em;
  color: var(--ink); display: inline-flex; align-items: center; gap: 9px;
}
.pq-modern .pq-mark::before {
  content: ''; width: 22px; height: 22px; border-radius: 7px; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--pink) 0%, var(--accent-2) 100%);
}
.pq-modern .pq-sub { opacity: .75; }
.pq-modern .viewtab {
  background: none; border: none; padding: 6px 2px; margin-right: 20px; border-radius: 0;
  color: var(--ink-3); font-size: 15px; font-weight: 500; position: relative;
}
.pq-modern .viewtab:hover { background: none; color: var(--ink); }
.pq-modern .viewtab.on { background: none; color: var(--ink); }
.pq-modern .viewtab.on::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -17px; height: 2px; background: var(--ink);
}
.pq-modern .card { border-radius: 14px; }
.pq-modern .btn { border-radius: 10px; padding: 8px 14px; }
.pq-modern .btn-primary { box-shadow: none; }
.pq-modern .task { border-radius: 14px; padding: 15px 16px 15px 13px; border-color: transparent; box-shadow: var(--shadow); }
.pq-modern .task:hover { box-shadow: 0 2px 4px rgba(20,20,30,.05), 0 22px 44px -30px rgba(20,20,30,.4); }
.pq-modern .queue { gap: 10px; }
.pq-modern .task-title { font-size: 18px; letter-spacing: -.02em; }
.pq-modern .section-tabs { gap: 6px; margin-bottom: 14px; }
.section-tab {
  font-family: var(--disp); font-size: 14px; font-weight: 500;
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--pink-line); background: var(--card); color: var(--ink-2);
}
.section-tab:hover { background: var(--pink-soft); }
.section-tab.on { background: var(--pink); border-color: var(--accent-edge); color: var(--on-accent); }

.review-section { border: none; box-shadow: var(--shadow); border-radius: 20px; padding: 26px; margin-bottom: 24px; }
.pq-modern .review-h2 { font-size: 30px; font-weight: 500; letter-spacing: -.035em; }
.pq-modern .review-section .card { border-radius: 12px; }
.pq-modern .drawer { border-radius: 20px 0 0 20px; }
.pq-modern .modal { border-radius: 20px; }
.pq-modern .inp { border-radius: 10px; padding: 9px 12px; }
.pq-modern .chip { border-radius: 999px; }
.pq-modern .pq-rail .card { border: none; box-shadow: var(--shadow); border-radius: 14px; }
.pq-modern .stat-hero { letter-spacing: -.04em; }
@media (max-width: 620px) {
  .pq-modern .pq-shell { padding: 0 14px 0; }
  .pq-modern .pq-top { padding: 12px 14px; margin: 0 -14px 18px; }
  .pq-modern .viewtab { margin-right: 14px; }
}

/* --- misc --- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 70;
  background: var(--ink); color: #FFF; padding: 9px 16px; border-radius: 999px; font-size: 13.5px;
  display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow);
}
.toast button { all: unset; cursor: pointer; color: var(--pink); font-weight: 600; }
.signin-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.signin { width: min(400px, 100%); }
.task.placeholder { background: repeating-linear-gradient(135deg, var(--pink-soft) 0 8px, var(--card) 8px 16px); border-left-color: var(--pink-line); cursor: default; }
/* Mirrors .pq-top exactly. The horizontal values must match the header's, not
   the shell's: the header pulls itself out by 20px (28px modern) and pads back
   in by the same, so anything wanting to line up with it has to use those two
   numbers rather than the shell padding. Change one, change the other. */
.pq-footer {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin: 36px -20px 0; padding: 12px 20px 14px;
  border-top: 1px solid var(--pink-line);
}
.pq-modern .pq-footer {
  margin: 40px -28px 0; padding: 13px 28px 15px;
  background: rgba(255,255,255,.55);
}
@media (max-width: 620px) {
  .pq-footer { margin: 28px -12px 0; padding: 11px 12px 13px; }
  .pq-modern .pq-footer { margin: 28px -14px 0; padding: 11px 14px 13px; }
}
.chip.setup-on { background: var(--rasp); color: #fff; border-color: transparent; font-weight: 600; }

/* Setup mode has to be impossible to leave on by accident, so every row turns
   red until it is switched off. */
.pq-setup .task { background: #FFF3F6; border-color: #F2C3D3; }
.pq-setup .task .task-title button { color: var(--rasp); }
.pq-setup .task.active { background: #FFE9F0; border-color: var(--rasp); box-shadow: 0 0 0 2px #F2C3D3; }
.pq-setup .pq-top { border-bottom-color: var(--rasp); }

.empty { text-align: center; padding: 44px 20px; border: 1px dashed var(--pink-line); border-radius: 12px; background: var(--card); }
.pass { color: var(--teal); } .fail { color: var(--rasp); }
.bar { height: 8px; background: var(--pink-soft); border-radius: 5px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--pink); }
